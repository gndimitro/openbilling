name: Publish Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm CLI
        run: |
          npm install -g npm@11.15.0
          npm --version
          npm help stage

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack packages
        run: |
          PACK_DIR="$RUNNER_TEMP/openbilling-packs"
          mkdir -p "$PACK_DIR"

          pnpm --filter @openbilling/core pack --pack-destination "$PACK_DIR"
          pnpm --filter @openbilling/stripe pack --pack-destination "$PACK_DIR"
          pnpm --filter @openbilling/dodo pack --pack-destination "$PACK_DIR"

          ls -lh "$PACK_DIR"

      - name: Stage packages on npm
        run: |
          PACK_DIR="$RUNNER_TEMP/openbilling-packs"

          npm stage publish "$PACK_DIR"/openbilling-core-*.tgz --access public
          npm stage publish "$PACK_DIR"/openbilling-stripe-*.tgz --access public
          npm stage publish "$PACK_DIR"/openbilling-dodo-*.tgz --access public
